# Local or single-host deployment: Postgres + Parley (+ optional TURN relay).
#   docker compose up -d --build
# Then open http://localhost:3000. Put a TLS-terminating proxy in front for real use.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: parley
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: parley
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parley"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      COOKIE_SECURE: "false"          # set true once served over HTTPS
      DATABASE_URL: postgres://parley:change-me@db:5432/parley
      TRUST_PROXY: "false"
      # SMTP_HOST: smtp.example.com
      # SMTP_USER: ...
      # SMTP_PASS: ...
      # MAIL_FROM: Parley <no-reply@example.com>
      # TURN_SECRET: same-as-coturn-static-auth-secret
      # TURN_URLS: turn:your.public.host:3478
    volumes: [uploads:/app/data/uploads]

  # Optional TURN relay for voice/video across restrictive networks.
  # coturn:
  #   image: coturn/coturn:4.6
  #   network_mode: host
  #   command: >
  #     -n --listening-port=3478 --fingerprint --use-auth-secret
  #     --static-auth-secret=same-as-TURN_SECRET --realm=parley
  #     --external-ip=YOUR.PUBLIC.IP --no-cli

volumes:
  pgdata:
  uploads:
